name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows binary
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"

      - name: Build VirtualDesktopShortcuts.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o dist/VirtualDesktopShortcuts.exe .

      - name: Build Setup_VirtualDesktopShortcuts.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o dist/Setup_VirtualDesktopShortcuts.exe ./setup

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: virtualdesktopshortcuts-windows-amd64
          path: |
            dist/VirtualDesktopShortcuts.exe
            dist/Setup_VirtualDesktopShortcuts.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/VirtualDesktopShortcuts.exe
            dist/Setup_VirtualDesktopShortcuts.exe
          generate_release_notes: true
