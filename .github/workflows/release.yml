name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows binary
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build vdesktop-switcher.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o dist/vdesktop-switcher.exe .

      - name: Build Setup_VirtualDesktopShortcuts.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o dist/Setup_VirtualDesktopShortcuts.exe ./setup

      - name: Package artifact
        run: |
          cd dist
          zip vdesktop-switcher-${{ github.ref_name }}-windows-amd64.zip vdesktop-switcher.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vdesktop-switcher-windows-amd64
          path: |
            dist/vdesktop-switcher.exe
            dist/Setup_VirtualDesktopShortcuts.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vdesktop-switcher-${{ github.ref_name }}-windows-amd64.zip
            dist/Setup_VirtualDesktopShortcuts.exe
          generate_release_notes: true
